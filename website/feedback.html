<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Cloud Training &amp; Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo">☁ CloudDevOps Academy</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="register.html">Register</a>
        <a href="feedback.html" class="active">Feedback</a>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <div class="card form-card">
      <h1>Student Feedback</h1>
      <p>Tell us about your experience so we can keep improving the program.</p>

      <form id="feedbackForm" action="submit.php" method="POST" novalidate>
        <input type="hidden" name="form_type" value="feedback">

        <div class="form-group">
          <label for="student_name">Your Name</label>
          <input type="text" id="student_name" name="student_name" maxlength="100" placeholder="e.g. Rahul Verma">
          <div class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="fb_email">Email Address</label>
          <input type="email" id="fb_email" name="email" maxlength="150" placeholder="you@example.com">
          <div class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="rating">Overall Rating</label>
          <select id="rating" name="rating">
            <option value="">-- Select rating --</option>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Very Good</option>
            <option value="3">3 - Good</option>
            <option value="2">2 - Fair</option>
            <option value="1">1 - Poor</option>
          </select>
          <div class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="comments">Comments</label>
          <textarea id="comments" name="comments" maxlength="1000" placeholder="What did you like? What can we improve?"></textarea>
          <small id="charCount" style="color:#64748b">0 / 1000 characters</small>
          <div class="field-error"></div>
        </div>

        <button type="submit" class="btn btn-primary">Submit Feedback</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; 2026 CloudDevOps Academy &middot; Cloud Training &amp; Student Portal</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
